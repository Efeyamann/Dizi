name: Android APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore signing key
        env:
          KEYSTORE: ${{ secrets.DIZI_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE"
          printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/dizi.p12"
      - name: Test, lint, build
        env:
          DIZI_KEYSTORE_PATH: ${{ runner.temp }}/dizi.p12
          DIZI_KEYSTORE_PASSWORD: ${{ secrets.DIZI_KEYSTORE_PASSWORD }}
          DIZI_VERSION_CODE: ${{ github.run_number }}
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleRelease --stacktrace
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/dizi.p12"
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: Dizi-APK
          path: app/build/outputs/apk/release/app-release.apk
          retention-days: 7
  publish:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Dizi-APK
          path: apk
      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cp apk/app-release.apk Dizi.apk
          gh release create "build-${GITHUB_RUN_NUMBER}" Dizi.apk --target "$GITHUB_SHA" --title "Dizi · build ${GITHUB_RUN_NUMBER}" --notes "Android 8+. Aynı imzayla güncellenir."
